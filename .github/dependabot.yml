version: 2

updates:
  # Maintain dependencies for the main project
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Maintain dependencies for the typescript template
  - package-ecosystem: "npm"
    directory: "/templates/typescript"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Maintain dependencies for the javascript template
  - package-ecosystem: "npm"
    directory: "/templates/javascript"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Maintain dependencies for the python template
  - package-ecosystem: "pip"
    directory: "/templates/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Maintain dependencies for the rust template
  - package-ecosystem: "cargo"
    directory: "/templates/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]