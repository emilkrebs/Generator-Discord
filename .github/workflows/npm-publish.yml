name: Node.js Package

permissions:
  contents: read
  id-token: write

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Update npm
        run: npm install -g npm@latest
      - name: Clean install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --provenance --access public